<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards de Mitos e Verdades</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>

        <section class="cartoes">
            <article class="cartao">

                <div class="cartao-conteudo">

                    <div class="cartao-frente">
                        <img src="https://loja.afixgraf.com.br/media/catalog/product/cache/411424c4889c6dc185e9275ae20b27b4/a/f/af-si0124-ps.jpg" 
                        alt="Pinguim" 
                        class="cartao-imagem">

                        <p>Você da a atenção necessária para a acessibilidade visual? Você pensa em ajudar quem tem essas dificuldades?</p>
                    </div>

                    <div class="cartao-verso">
                        <img src="https://img.icons8.com/p1em/1200/blind.jpg" 
                        alt="GRÊMIO" 
                        class="cartao-imagem">

                        <p>Acho que não né, pois então comece, não é só você que precisa de ajuda!</p>
                    </div>

                </div>

            </article>
            <section class="cartoes">
    </main>

    <footer>
        <p>Projeto feito por [Davi Gallina]</p>
    </footer>

</body>
</html>
